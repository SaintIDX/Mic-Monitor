name: Build Windows executables

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build main app  (mic-monitor-v4-eng.py)
        run: >
          pyinstaller
          --onefile
          --noconsole
          --name mic-monitor
          --hidden-import pystray._win32
          --collect-submodules PIL
          mic-monitor-v4-eng.py

      - name: Build lite app  (mic-monitor-lite.py)
        run: >
          pyinstaller
          --onefile
          --noconsole
          --name mic-monitor-lite
          --hidden-import pystray._win32
          --collect-submodules PIL
          mic-monitor-lite.py

      - name: Upload mic-monitor.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mic-monitor.exe

      - name: Upload mic-monitor-lite.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mic-monitor-lite.exe
